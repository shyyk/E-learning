name: Deploy to Two EC2 Servers

on:
  push:
    branches:
      - master   # changed from main to master

jobs:
  deploy-ec2-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key for EC2-1
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MY_KEY_1 }}" > ~/.ssh/my-key-1
          chmod 600 ~/.ssh/my-key-1

      - name: Deploy to EC2-1
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/my-key-1 ubuntu@${{ secrets.EC2_HOST_1 }} '
            cd /var/www/myapp || mkdir -p /var/www/myapp
            git pull origin master
            # add your deployment commands here
          '

  deploy-ec2-2:
    runs-on: ubuntu-latest
    needs: deploy-ec2-1   # optional: run after EC2-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key for EC2-2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MY_KEY_2 }}" > ~/.ssh/my-key-2
          chmod 600 ~/.ssh/my-key-2

      - name: Deploy to EC2-2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/my-key-2 ubuntu@${{ secrets.EC2_HOST_2 }} '
            cd /var/www/myapp || mkdir -p /var/www/myapp
            git pull origin master
            # add your deployment commands here
          '
