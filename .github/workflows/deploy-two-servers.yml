name: Deploy Website to Two EC2 Servers

on:
  push:
    branches:
      - master  # change to 'main' if your repo uses main

jobs:
  deploy-ec2-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key for EC2-1
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MY_KEY_1 }}" > ~/.ssh/my-key-1
          chmod 600 ~/.ssh/my-key-1

      - name: Add EC2-1 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST_1 }} >> ~/.ssh/known_hosts

      - name: Deploy Website to EC2-1
        run: |
          echo "Starting deployment to EC2-1..."
          rsync -av --delete -e "ssh -i ~/.ssh/my-key-1 -o StrictHostKeyChecking=no" ./ ubuntu@${{ secrets.EC2_HOST_1 }}:/var/www/html
          echo "Deployment to EC2-1 completed successfully!"

  deploy-ec2-2:
    runs-on: ubuntu-latest
    needs: deploy-ec2-1  # optional: run after EC2-1, remove for parallel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key for EC2-2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MY_KEY_2 }}" > ~/.ssh/my-key-2
          chmod 600 ~/.ssh/my-key-2

      - name: Add EC2-2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST_2 }} >> ~/.ssh/known_hosts

      - name: Deploy Website to EC2-2
        run: |
          echo "Starting deployment to EC2-2..."
          rsync -av --delete -e "ssh -i ~/.ssh/my-key-2 -o StrictHostKeyChecking=no" ./ ubuntu@${{ secrets.EC2_HOST_2 }}:/var/www/html
          echo "Deployment to EC2-2 completed successfully!"
